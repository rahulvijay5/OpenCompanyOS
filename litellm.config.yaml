# LiteLLM proxy config. Model names here are what CHAT_MODEL and EMBEDDING_MODEL
# select. Provider keys come from the environment, not from this file.
# Docs: https://docs.litellm.ai/docs/

model_list:
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: embedding
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
      # Keep this aligned with EMBEDDING_DIMENSIONS (default 768).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
